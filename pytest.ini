; Repo-root test configuration.
;
; Herald's tests live in two places that cannot share a rootdir: backend/tests
; imports `app.*` (installed with `pip install -e backend`), and marketing/tests
; drives a pair of standalone scripts that are not a package at all. Running
; `pytest` from backend/ still picks up backend/pyproject.toml and behaves
; exactly as it always has; this file exists so that `pytest` from the repo root
; runs *everything*, which is what "the full suite" should mean.
[pytest]
testpaths = backend/tests marketing/tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
