<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="DoAide Pulse — your digital robot for newsletters. Writes, schedules, publishes."
    />
    <title>DoAide Pulse</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-title" content="DoAide Pulse" />

    <!-- Open Graph -->
    <meta property="og:title" content="DoAide Pulse — AI-Powered Newsletters" />
    <meta property="og:description" content="Create and send AI-powered newsletters. Automate content curation, writing, and distribution." />
    <meta property="og:url" content="https://pulse.doaide.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pulse.doaide.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="DoAide" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DoAide Pulse — AI-Powered Newsletters" />
    <meta name="twitter:description" content="Create and send AI-powered newsletters with AI." />

    <!-- Umami Analytics -->
    <script defer src="https://analytics.doaide.com/script.js" data-website-id="f2c7eb8a-8d84-41f6-9879-2e5ccb74edf5"></script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DoAide Pulse",
      "description": "AI-powered newsletter platform. Automate content curation, writing, and distribution.",
      "url": "https://pulse.doaide.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Apprend Technologies",
        "url": "https://doaide.com"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DoAide Pulse",
      "url": "https://pulse.doaide.com",
      "description": "AI-powered newsletter platform — create, optimize, and send newsletters that convert.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://pulse.doaide.com/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DoAide",
      "url": "https://doaide.com",
      "logo": "https://pulse.doaide.com/favicon.svg",
      "sameAs": ["https://twitter.com/doaide"]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function(){var s=localStorage.getItem('pulse-theme');var d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.classList.add('dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?'#0A0A0B':'#FFFFFF';var c=document.querySelector('meta[name="color-scheme"]');if(c)c.content=d?'dark':'light'})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
