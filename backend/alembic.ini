# Alembic configuration for Pulse.
# The DB URL is injected at runtime from app settings (see alembic/env.py),
# so no credentials live in this file.
[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.16 replaced `version_path_separator` with one key covering both
# `prepend_sys_path` and `version_locations`. Without it, 1.16+ warns on every
# invocation that it is "falling back to legacy splitting on spaces, commas and
# colons" — on each `alembic upgrade head` a deploy runs, and as an error inside
# the test suite, which turns warnings into failures. `os` means os.pathsep,
# which is what the old key already said.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
