# Packaging + tool configuration. Runtime dependencies live in
# requirements.txt (the Dockerfile installs from there); this file exists so
# `pip install -e .` puts `app` on the path and so ruff/pytest have a home.
[project]
name = "pulse-backend"
version = "0.1.0"
description = "Pulse — AI marketing automation for developer projects (FastAPI backend)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `error`, not `ignore::DeprecationWarning`. The blanket ignore was hiding
# nothing — with it lifted the suite emitted exactly one deprecation, from
# Starlette's test client — but it also meant the *next* one would arrive
# silently, and a deprecation is a dated notice that some dependency is about
# to stop working. Pulse tracks FastAPI and Starlette closely enough that the
# notice period is the only warning it gets. Anything genuinely unfixable from
# here belongs below this line with a reason attached, not under a category
# ignore that also covers everything nobody has looked at yet.
filterwarnings = ["error"]

# Coverage is configured here rather than passed on the command line, so that a
# bare `pytest --cov` is the whole gate: source, branch mode and the regression
# floor all come from this file. It is deliberately *not* in `addopts` — the
# bare suite is ~60s and the traced one ~80s, and that third again belongs on
# the gate rather than on every ordinary run.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
# The floor sits just under the measured total (line + branch) so that an
# unrelated change cannot quietly delete coverage, while a normal patch that
# adds a line or two of straight-line code does not trip it. Raise it when the
# real number moves up; never lower it to make a red run go green.
#
# Measured 100.00% (9131 statements, 2098 branches, none missed). The floor is
# 99.9 rather than 100 so that a work-in-progress commit is not blocked by a
# single uncovered line, which leaves roughly ten statements of slack out of
# ten thousand. If a branch turns out to be genuinely unreachable, mark it
# `# pragma: no cover - <reason>` as the rest of the tree does and pin the
# invariant that makes it unreachable with a test — do not spend the slack.
fail_under = 99.9
exclude_also = [
    # `if TYPE_CHECKING:` blocks exist for the type checker and never execute.
    "if TYPE_CHECKING:",
    # Abstract methods are contracts; the bodies are `raise NotImplementedError`
    # and every real caller goes through a concrete subclass.
    "raise NotImplementedError",
    # Module-level `__main__` guards are entry points, not library code.
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The documented gate is `ruff check app tests` (see the README), so anyone who
# instead runs `ruff check .` — the obvious command — got 54 findings from
# generated migration files and nothing from the code the gate covers. Noise
# that everyone learns to scroll past is the state in which a real finding goes
# unread, so the exclusion is written down here and the two commands now agree.
#
# `alembic/versions` only. `alembic/env.py` is hand-written and stays in scope.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set has widened across releases, so
# relying on the default would make lint results depend on the install date.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # `x: Type = Depends(...)` is the FastAPI idiom for dependency injection —
    # the whole API surface would need noqa without this.
    "B008",
    # `class X(str, Enum)` is deliberate: members must compare equal to their
    # stored string for SQLAlchemy's non-native Enum columns and for Pydantic
    # serialization. StrEnum is not a drop-in replacement here.
    "UP042",
]
